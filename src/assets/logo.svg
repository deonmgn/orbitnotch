<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="128" y1="64" x2="896" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="160" y1="300" x2="864" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillRim" x1="250" y1="412" x2="774" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle -->
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bgGrad)"/>
  <rect x="68" y="68" width="888" height="888" rx="216" stroke="white" stroke-opacity="0.08" stroke-width="8"/>

  <!-- Ambient Glow -->
  <circle cx="512" cy="512" r="340" fill="url(#glowGrad)"/>

  <!-- Back Orbital Arc -->
  <g transform="rotate(-22 512 512)">
    <ellipse cx="512" cy="512" rx="355" ry="138" stroke="url(#orbitGrad)" stroke-width="26" stroke-opacity="0.35" stroke-dasharray="620 400" stroke-linecap="round"/>
  </g>

  <!-- Central Dynamic Notch Pill -->
  <rect x="232" y="402" width="560" height="220" rx="110" fill="#000000"/>
  <rect x="234" y="404" width="556" height="216" rx="108" stroke="url(#pillRim)" stroke-width="6"/>

  <!-- Camera Lens / Core Dot -->
  <circle cx="352" cy="512" r="44" fill="#0B1120" stroke="#1E293B" stroke-width="6"/>
  <circle cx="352" cy="512" r="18" fill="#22D3EE"/>

  <!-- Mini Wave Bars inside Pill -->
  <rect x="462" y="484" width="24" height="56" rx="12" fill="#38BDF8"/>
  <rect x="506" y="458" width="24" height="108" rx="12" fill="#818CF8"/>
  <rect x="550" y="472" width="24" height="80" rx="12" fill="#A855F7"/>
  <rect x="594" y="492" width="24" height="40" rx="12" fill="#C084FC"/>
  <rect x="656" y="498" width="28" height="28" rx="14" fill="#34D399"/>

  <!-- Front Orbital Ring & Satellite -->
  <g transform="rotate(-22 512 512)">
    <path d="M 168 548 A 355 138 0 0 0 856 548" stroke="url(#orbitGrad)" stroke-width="28" stroke-linecap="round"/>
    <circle cx="842" cy="552" r="26" fill="#22D3EE"/>
    <circle cx="842" cy="552" r="12" fill="#FFFFFF"/>
  </g>
</svg>
